name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  platform:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

  verify:
    if: ${{ always() }}
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all platform checks passed
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = "success"
